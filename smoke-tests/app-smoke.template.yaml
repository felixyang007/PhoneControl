# P0 smoke template for the product app — copy per app and fill in the TODOs.
# Pass the package via env: `maestro test --env APP_ID=ai.plaud.app app-smoke.yaml`.
#
# Covers the report's P0 set: install/launch/no-crash, permission dialogs,
# home/nav, one core business loop, login. Keep it under ~10 min — smoke, not
# regression. Delete steps that don't apply.
appId: ${APP_ID}
---
# 1) Cold start, no crash / white screen. Auto-grant runtime permissions so the
#    location/camera/notification dialogs don't block the run.
- launchApp:
    clearState: true
    permissions:
      all: allow
- takeScreenshot: 01-cold-start

